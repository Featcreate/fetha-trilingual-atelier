name: Cart formatting diagnostic

on:
  push:
    branches:
      - feat/multi-product-cart-unified-checkout

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Format the cart bundle files
        run: |
          bunx prettier --write src/lib/cart.tsx src/routes/cart.tsx src/routes/catalog.tsx src/routes/checkout.tsx 'src/routes/products/$id.tsx'
      - name: Print formatting diff
        run: git diff -- src/lib/cart.tsx src/routes/cart.tsx src/routes/catalog.tsx src/routes/checkout.tsx 'src/routes/products/$id.tsx'
