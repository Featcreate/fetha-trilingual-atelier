name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format checkout delivery integration
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/checkout-delivery-main-integration'
        run: |
          bunx prettier --write src/lib/download-stream.ts src/routes/_authenticated/orders.tsx src/routes/api/download.ts src/routes/checkout.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/download-stream.ts src/routes/_authenticated/orders.tsx src/routes/api/download.ts src/routes/checkout.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier formatting to checkout delivery integration"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check migration journal
        run: bun run check:migrations

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx' '*.json' '*.md' '*.css' '*.html' '*.yml' '*.yaml')
          if (( ${#files[@]} )); then
            bunx prettier --check "${files[@]}"
          else
            echo "No changed files require formatting."
          fi

      - name: Lint
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx')
          if (( ${#files[@]} )); then
            bunx eslint "${files[@]}"
          else
            echo "No changed source files require linting."
          fi

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
