name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format CI working copy (no repository write)
        run: bunx prettier --write "**/*.{ts,tsx,js,jsx,json,md,css,html,yml,yaml}"

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
