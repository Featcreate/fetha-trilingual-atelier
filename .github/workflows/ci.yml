name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply one-time Prettier repair to the approved PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/approved-category-icons' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx' '*.json' '*.md' '*.css' '*.html' '*.yml' '*.yaml' ':!.lovable/plan.md')
          if (( ${#files[@]} )); then
            bunx prettier --write "${files[@]}"
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- "${files[@]}"
              git commit -m "style: format approved category taxonomy changes"
              git push origin HEAD:fix/approved-category-icons
            fi
          fi

      - name: Check migration journal
        run: bun run check:migrations

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          # Exclude the archived planning artifact; CI validates application and configuration files.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx' '*.json' '*.md' '*.css' '*.html' '*.yml' '*.yaml' ':!.lovable/plan.md')
          if (( ${#files[@]} )); then
            bunx prettier --check "${files[@]}"
          else
            echo "No changed files require formatting."
          fi

      - name: Lint
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx')
          if (( ${#files[@]} )); then
            bunx eslint "${files[@]}"
          else
            echo "No changed source files require linting."
          fi

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
