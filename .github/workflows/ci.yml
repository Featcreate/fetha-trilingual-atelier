name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration journal
        run: bun run check:migrations

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          # Exclude the archived planning artifact; CI validates application and configuration files.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx' '*.json' '*.md' '*.css' '*.html' '*.yml' '*.yaml' ':!.lovable/plan.md')
          if (( ${#files[@]} )); then
            bunx prettier --check "${files[@]}"
          else
            echo "No changed files require formatting."
          fi

      - name: Lint
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD^"
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx')
          if (( ${#files[@]} )); then
            bunx eslint "${files[@]}"
          else
            echo "No changed source files require linting."
          fi

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase PostgreSQL
        run: supabase start -x studio,inbucket,edge-runtime,logflare,vector,supavisor,imgproxy

      - name: Apply all migrations and run SQL security regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\\(.*\\)"$/\\1/p')"
          if [[ -z "$DB_URL" ]]; then
            echo "Could not obtain the local Supabase DB_URL."
            supabase status
            exit 1
          fi
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            migration="drizzle/migrations/${tag}.sql"
            if [[ ! -f "$migration" ]]; then
              echo "Journal entry has no migration file: $migration"
              exit 1
            fi
            echo "Applying $migration"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(jq -r '.entries | sort_by(.idx)[] | .tag' drizzle/migrations/meta/_journal.json)
          for test_file in \\
            drizzle/tests/identity_rpc_security_regression.sql \\
            drizzle/tests/seller_order_privacy_regression.sql \\
            drizzle/tests/payment_beneficiary_regression.sql \\
            drizzle/tests/translation_rate_limit_security_regression.sql; do
            echo "Running $test_file"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
