name: iPay hourly reconciliation

on:
  schedule:
    # GitHub Actions schedules are UTC; the service limits each run to 20 orders.
    - cron: "17 * * * *"
    # Daily cleanup runs separately from hourly payment reconciliation.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipay-hourly-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Validate reconciliation secret
        env:
          RECONCILE_SECRET: ${{ secrets.IPAY_RECONCILE_CRON_SECRET }}
        run: |
          if [[ -z "$RECONCILE_SECRET" ]]; then
            echo "Missing repository secret IPAY_RECONCILE_CRON_SECRET"
            exit 1
          fi
      - name: Request bounded reconciliation batch
        env:
          RECONCILE_SECRET: ${{ secrets.IPAY_RECONCILE_CRON_SECRET }}
        run: |
          # Print a non-reversible fingerprint so it can be compared with Render logs.
          SECRET_FINGERPRINT="$(printf '%s' "$RECONCILE_SECRET" | sha256sum | cut -c1-12)"
          echo "Reconciliation secret fingerprint: $SECRET_FINGERPRINT"
          echo "Reconciliation secret length: ${#RECONCILE_SECRET} bytes"
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 360 \
            -X POST \
            -H "x-ipay-reconcile-secret: ${RECONCILE_SECRET}" \
            "https://algorea-bazaar.onrender.com/api/public/ipay/webhook"

  cleanup-expired-orders:
    if: github.event_name == 'schedule' && github.event.schedule == '41 3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate cleanup secret
        env:
          CLEANUP_SECRET: ${{ secrets.IPAY_RECONCILE_CRON_SECRET }}
        run: |
          if [[ -z "$CLEANUP_SECRET" ]]; then
            echo "Missing repository secret IPAY_RECONCILE_CRON_SECRET"
            exit 1
          fi
      - name: Delete only safely expired unpaid orders
        env:
          CLEANUP_SECRET: ${{ secrets.IPAY_RECONCILE_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 240 \
            -X POST \
            -H "x-ipay-reconcile-secret: ${CLEANUP_SECRET}" \
            "https://algorea-bazaar.onrender.com/api/public/orders/cleanup"
