name: Temporary PR 102 formatting repair

on:
  push:
    branches:
      - feature/central-seller-ledger-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/central-seller-ledger-dashboard
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/i18n.ts src/routes/_authenticated/admin.tsx src/routes/_authenticated/seller.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/i18n.ts src/routes/_authenticated/admin.tsx src/routes/_authenticated/seller.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format seller ledger changes"
            git push origin HEAD:feature/central-seller-ledger-dashboard
          fi
