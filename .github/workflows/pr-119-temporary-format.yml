name: Temporary PR 119 formatter
on:
  push:
    branches:
      - feat/platform-manual-checkout-admin
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr119-temporary-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out development branch
        uses: actions/checkout@v5
        with:
          ref: feat/platform-manual-checkout-admin
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx' '*.json' '*.md' '*.css' '*.html' '*.yml' '*.yaml' ':!.lovable/plan.md')
          if (( ${#files[@]} )); then
            bunx prettier --write "${files[@]}"
          fi
      - name: Validate migration journal
        run: bun run check:migrations
      - name: Typecheck
        run: bun run typecheck
      - name: Check formatting
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx' '*.json' '*.md' '*.css' '*.html' '*.yml' '*.yaml' ':!.lovable/plan.md')
          if (( ${#files[@]} )); then
            bunx prettier --check "${files[@]}"
          fi
      - name: Lint changed source files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.jsx')
          if (( ${#files[@]} )); then
            bunx eslint "${files[@]}"
          fi
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/pr-119-temporary-format.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "Format PR 119 and remove temporary formatter"
            git push origin HEAD:feat/platform-manual-checkout-admin
          fi
