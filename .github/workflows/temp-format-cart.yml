name: Temporary cart formatter

on:
  push:
    branches:
      - fix/ipay-payment-button-cart-only

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ipay-payment-button-cart-only
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/cart.tsx
      - name: Commit formatted file
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/cart.tsx
            git commit -m "style: format cart checkout"
            git push
          fi
