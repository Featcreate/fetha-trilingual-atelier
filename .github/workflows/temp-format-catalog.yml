name: Temporary catalog formatter
on:
  push:
    branches:
      - feat/category-subcategory-navigation
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/catalog.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-catalog
          path: src/routes/catalog.tsx
