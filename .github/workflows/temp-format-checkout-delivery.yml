name: Temporary format checkout delivery integration

on:
  push:
    branches:
      - feature/checkout-delivery-main-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/checkout-delivery-main-integration
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/download-stream.ts src/routes/_authenticated/orders.tsx src/routes/api/download.ts src/routes/checkout.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/download-stream.ts src/routes/_authenticated/orders.tsx src/routes/api/download.ts src/routes/checkout.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier formatting to checkout delivery integration"
            git push
          fi
