name: Temporary format buyer orders

on:
  push:
    branches:
      - feature/checkout-delivery-main-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/checkout-delivery-main-integration
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/_authenticated/orders.tsx
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/orders.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format typed buyer orders query"
            git push
          fi
