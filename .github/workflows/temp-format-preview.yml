name: Temporary Prettier format preview
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/seller-product-promotions
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write "src/routes/_authenticated/seller.tsx" "src/routes/catalog.tsx" "src/routes/stores/\$slug.tsx"
      - run: git diff -- "src/routes/_authenticated/seller.tsx" "src/routes/catalog.tsx" "src/routes/stores/\$slug.tsx"
