name: Temporary Prettier repair

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/paid-advertising-ipay-design.md"
      - "src/routes/_authenticated/admin.tsx"
      - ".github/workflows/temporary-prettier-repair.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format the two files
        run: bunx prettier --write docs/paid-advertising-ipay-design.md src/routes/_authenticated/admin.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paid-advertising-ipay-design.md src/routes/_authenticated/admin.tsx
          git commit -m "style: apply Prettier to advertising files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
