name: Validate digital download hardening

on:
  push:
    branches:
      - feature/digital-product-delivery-hardening
  pull_request:
    branches:
      - feature/ipay-checkout-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check migration journal
        run: bun run check:migrations
      - name: Run unit tests
        run: bun run test
      - name: Type check
        run: bun run typecheck
      - name: Build production bundle
        run: bun run build
